; Production overrides, loaded after php.ini (the image's php.ini-production).
; Copied to $PHP_INI_DIR/conf.d/zz-production.ini by the Dockerfile.

[PHP]
expose_php             = Off
display_errors         = Off
display_startup_errors = Off
log_errors             = On

; Keep in sync with client_max_body_size in nginx.conf.
upload_max_filesize = 512M
post_max_size       = 512M
memory_limit        = 512M
max_file_uploads    = 20

; Keep max_execution_time equal to request_terminate_timeout (www.conf).
max_execution_time = 300
max_input_time     = 300
; WordPress menus with many items exceed the default of 1000.
max_input_vars     = 3000

allow_url_include = Off
; nginx only passes scripts that exist; never let PHP guess a script from
; PATH_INFO (the code path patched for CVE-2026-129538).
cgi.fix_pathinfo  = 0

realpath_cache_size = 4096k
realpath_cache_ttl  = 600

[Date]
; Keep in sync with TIMEZONE in the Dockerfile.
date.timezone = Asia/Bangkok

[Session]
session.use_strict_mode  = 1
session.use_only_cookies = 1
session.cookie_httponly  = 1
session.cookie_samesite  = Lax
; php.net advised turning this off as a mitigation for the 2026 session CVEs
; (e.g. CVE-2026-115560). WordPress does not use upload progress.
session.upload_progress.enabled = 0

[opcache]
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 20000
; WordPress updates core, plugins and themes in place, so file timestamps must
; stay validated or updated code would never be loaded.
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 2
