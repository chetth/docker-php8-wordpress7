; PHP-FPM pool "www" — production settings.
;
; Copied to /usr/local/etc/php-fpm.d/www.conf by the Dockerfile. It loads after
; the php image's docker.conf, so every value set here wins over that file.
; Reference for every directive: /usr/local/etc/php-fpm.d/www.conf.default
; PHP ini settings (limits, opcache, sessions) live in php-production.ini.

[www]
user  = www-data
group = www-data

; Unix socket shared with nginx inside this container only. The php image
; default (`listen = 9000`) binds every interface, which lets any other
; container on the Compose network send FastCGI requests straight to PHP.
listen         = /run/php-fpm/www.sock
listen.owner   = www-data
listen.group   = www-data
listen.mode    = 0660
listen.backlog = 511

; ------------------------------------------------------------ process manager
; Size pm.max_children from memory, not from traffic:
;   pm.max_children ~= (RAM you can give PHP) / (average worker RSS)
; A WordPress worker usually sits at 60-120 MB RSS. Measure under load with:
;   docker exec web ps -o rss,args | grep 'php-fpm: pool'
; memory_limit (php-production.ini) is the per-request ceiling, so in the worst
; case max_children x memory_limit must still fit the host.
;
; Values come from environment variables with defaults in the Dockerfile, so
; each host can be tuned in docker-compose.yml without rebuilding the image.
pm                      = ${PHP_FPM_PM}
pm.max_children         = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers        = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers    = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers    = ${PHP_FPM_MAX_SPARE_SERVERS}
; Recycle workers periodically to contain slow memory leaks in plugins.
pm.max_requests         = ${PHP_FPM_MAX_REQUESTS}
; Used only when PHP_FPM_PM=ondemand.
pm.process_idle_timeout = 10s

; ------------------------------------------------------------------ timeouts
; Hard kill for runaway requests. Keep equal to max_execution_time
; (php-production.ini) and no higher than fastcgi_read_timeout (nginx.conf).
request_terminate_timeout = 300s

; --------------------------------------------------------- status & health
; nginx only serves these to 127.0.0.1 (the container healthcheck).
pm.status_path = /fpm-status
ping.path      = /fpm-ping
ping.response  = pong

; ------------------------------------------------------------------- logging
; nginx already logs every request (with upstream timing), so the FPM access
; log the php image enables in docker.conf would only duplicate it.
access.log = /dev/null
; Worker stdout/stderr (PHP errors) go to the container log.
catch_workers_output    = yes
decorate_workers_output = no
; Slow-request backtraces need ptrace, i.e. `cap_add: [SYS_PTRACE]` on the
; container. Enable only while investigating:
;request_slowlog_timeout = 10s
;slowlog = /proc/self/fd/2

; ------------------------------------------------------------------ security
; Only *.php may be executed, whatever nginx passes in SCRIPT_FILENAME.
security.limit_extensions = .php
; Workers start with an empty environment, so container variables (and any
; secrets added to them later) are not readable through getenv()/$_SERVER.
; Whitelist what the application needs, for example:
;env[WORDPRESS_DB_HOST] = $WORDPRESS_DB_HOST
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMPDIR] = /tmp

; Uncomment to block shell execution from PHP. Some backup, image-optimisation
; and migration plugins rely on these, so test before enabling.
;php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

rlimit_files = 65535
rlimit_core  = 0
