services:
  web:
    build: .
    container_name: web
    restart: always
    # tini as PID 1: reaps zombie processes and forwards signals to start.sh.
    init: true
    stop_grace_period: 30s
    ports:
      - 8888:80
    volumes:
      - ./html:/var/www/html
    # PHP-FPM pool sizing (defaults in the Dockerfile). Size to this host's RAM;
    # see www.conf.
    # environment:
    #   - PHP_FPM_MAX_CHILDREN=20
    #   - PHP_FPM_START_SERVERS=4
    #   - PHP_FPM_MIN_SPARE_SERVERS=2
    #   - PHP_FPM_MAX_SPARE_SERVERS=6
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Access logs now go to stdout; cap their size on disk.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  db:
    image: mariadb:11.4
    container_name: db
    restart: always
    volumes:
      - wordpress_db:/var/lib/mysql
    # Credentials come from .env (git-ignored; template: .env.example).
    # Compose refuses to start if a password is missing. These values only
    # take effect when the volume is first initialised — see README,
    # "Database credentials".
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env (see .env.example)}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env (see .env.example)}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  wordpress_db: {}
