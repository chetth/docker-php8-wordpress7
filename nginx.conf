# OpenResty (nginx 1.31.9) — production configuration for PHP-FPM / WordPress.
#
# nginx runs in the foreground (`daemon off`); start.sh supervises it together
# with php-fpm. Logs go to stdout/stderr so `docker logs` and any log driver
# pick them up.

user                    www-data www-data;
worker_processes        auto;
worker_rlimit_nofile    65535;
worker_shutdown_timeout 30s;
daemon                  off;
pcre_jit                on;

error_log /dev/stderr warn;

events {
    worker_connections 16384;
    multi_accept       on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ---------------------------------------------------------------- logging
    log_format main escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout main;

    # ------------------------------------------------------------ core / perf
    sendfile                  on;
    tcp_nopush                on;
    tcp_nodelay               on;
    server_tokens             off;
    more_clear_headers        Server X-Powered-By;
    reset_timedout_connection on;
    # Relative redirects, so directory redirects keep the published host port
    # (e.g. :8888) instead of the container's :80.
    absolute_redirect         off;

    keepalive_timeout         65s;
    keepalive_requests        1000;
    client_header_timeout     15s;
    client_body_timeout       60s;   # between two reads, not the whole upload
    send_timeout              60s;

    # --------------------------------------------------------- request limits
    # Keep client_max_body_size in sync with upload_max_filesize / post_max_size
    # in php-production.ini.
    client_max_body_size          512m;
    client_body_buffer_size       128k;
    client_header_buffer_size     4k;
    large_client_header_buffers   4 32k;
    server_names_hash_bucket_size 64;

    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # -------------------------------------------------------------- compression
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        application/atom+xml application/javascript application/json
        application/ld+json application/manifest+json application/rss+xml
        application/vnd.ms-fontobject application/xhtml+xml application/xml
        font/otf font/ttf image/svg+xml image/x-icon
        text/css text/javascript text/plain text/xml;

    # ------------------------------------------------------------ rate limits
    # Brute-force protection for WordPress login and XML-RPC, per client IP.
    limit_req_zone   $binary_remote_addr zone=wp_login:10m  rate=30r/m;
    limit_req_zone   $binary_remote_addr zone=wp_xmlrpc:10m rate=60r/m;
    limit_req_status    429;
    limit_req_log_level warn;

    # ------------------------------------------------- behind a proxy / CDN?
    # Without this, $remote_addr is the proxy's address: logs lose the client
    # IP and every visitor shares one login rate-limit bucket. Trust ONLY the
    # proxy's own address range, or clients can spoof their IP.
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    lua_package_path "/opt/openresty/lualib/?.lua;;";

    upstream php_fpm {
        server unix:/run/php-fpm/www.sock;
        # Deliberately no `keepalive` here and no `fastcgi_keep_conn on` below:
        # reusing FastCGI connections is the precondition for PHP-FPM request
        # smuggling CVE-2026-129289.
    }

    server {
        listen      80 default_server;
        server_name _;

        root  /var/www/html;
        index index.php index.html;

        log_not_found off;

        # Security headers. nginx drops ALL inherited add_header directives in
        # any location that declares its own, so do not add add_header below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Enable only once the site is served exclusively over HTTPS:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # FastCGI defaults for every PHP location below. fastcgi_param is only
        # inherited by locations that define none of their own — keep it that way.
        include       fastcgi.conf;
        fastcgi_param HTTP_PROXY "";                # httpoxy
        fastcgi_index index.php;
        fastcgi_connect_timeout   5s;
        fastcgi_send_timeout      300s;
        fastcgi_read_timeout      300s;             # >= request_terminate_timeout (www.conf)
        fastcgi_buffer_size       32k;
        fastcgi_buffers           16 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_hide_header       X-Powered-By;

        # ------------------------------ health & metrics: container-local only
        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny  all;
        }

        location ~ ^/fpm-(?:status|ping)$ {
            access_log off;
            allow 127.0.0.1;
            deny  all;
            fastcgi_pass php_fpm;
        }

        # ---------------------------------------------------------- deny rules
        # Regex locations are matched in order, so these must stay above the
        # generic \.php$ location.

        # Dotfiles (.git, .env, .htaccess, ...), except ACME challenges.
        location ~ /\.(?!well-known/) {
            deny all;
        }

        # Config, version disclosure and dependency manifests.
        location ~* (?:^|/)(?:wp-config\.php|readme\.html|license\.txt|composer\.(?:json|lock)|package(?:-lock)?\.json)$ {
            deny all;
        }

        # Backups, dumps, logs (e.g. wp-content/debug.log) and editor swap files.
        location ~* \.(?:bak|backup|dist|inc|ini|log|old|orig|sh|sql|swo|swp)~?$ {
            deny all;
        }

        # Never execute PHP from writable content directories.
        location ~* ^/wp-content/(?:uploads|files|cache|upgrade)/.*\.php$ {
            deny all;
        }

        # ------------------------------------------------------------ WordPress
        location = /favicon.ico {
            access_log off;
            try_files  $uri =204;
        }

        location = /robots.txt {
            access_log off;
            try_files  $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~* \.(?:css|js|mjs|map|jpe?g|gif|png|webp|avif|svg|ico|bmp|woff2?|ttf|otf|eot|mp3|mp4|m4a|ogg|ogv|webm)$ {
            expires    30d;
            access_log off;
            # Fall back to WordPress for assets that plugins generate on the fly.
            try_files  $uri /index.php$is_args$args;
        }

        location = /wp-login.php {
            limit_req zone=wp_login burst=20 nodelay;
            try_files $uri =404;
            fastcgi_pass php_fpm;
        }

        location = /xmlrpc.php {
            limit_req zone=wp_xmlrpc burst=30 nodelay;
            try_files $uri =404;
            fastcgi_pass php_fpm;
        }

        location ~ \.php$ {
            # Only run scripts that exist; blocks /upload.jpg/x.php style tricks.
            try_files $uri =404;
            fastcgi_pass php_fpm;
        }
    }
}
